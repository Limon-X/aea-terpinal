isBio: true
isBug: false

transportSlotsNeeded: 100
isUnrepairableUnit: true

numBitsOnDeath: 5
selfRegenRate:0.08
softCollisionOnAll: 12

fogOfWarSightRange: 28

tags: infantry
#---------------------------
[action_uncloak]
convertTo: Isniper
text: Put away sniper
description: Switch to recon mode
buildSpeed: 2.00s
whenBuilding_cannotMove: true
allowMultipleInQueue: false
clearAllWaypoints: true
displayType: upgrade
[hiddenAction_converTo_A]
#No tricks! force to convertTo IsniperHelicopter bruv
autoTrigger: if self.hasParent(withTag='Helicopter')
convertTo: IsniperHelicopter
[hiddenAction_kashTan_debuff]
autoTrigger: if self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=1000, withTag='KashtanRadarOn')
convertTo: Isniper
#addResources: energy=-${core.energyMax}
spawnEffects: CUSTOM:warning
