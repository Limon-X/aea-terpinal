
[core]
name: InvisiblesniperBuff
displayText: Hidden Sniper
displayDescription: - \n -Can attack land only\n -Long range
displayText_ru: Финский Снайпер
displayDescription_ru: - На подсосе в непердимке \n- Если враг ближе, чем 160 каких-то единиц расстояния, раскрывает карты
displayText_zh: 狙击手 [隐身模式]
displayDescription_zh:-武器为反坦克狙击步枪的精英步兵\n-必须处于狙击模式才能发挥远距离和高伤害特性\n-能攻击地面和空中单位\n-射程很远\n-对建筑结构的影响不大
class: CustomUnitMetadata
price: 1000
maxHp: 60
mass: 200
showInEditor: false
techLevel: 2
experimental: false
buildSpeed: 0.0007
#availableInDemo: true

canNotBeDirectlyAttacked: true



radius: 6
