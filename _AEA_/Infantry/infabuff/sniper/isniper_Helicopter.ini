
[core]
name: IsniperHelicopterBuff
copyFrom: isniper.ini
showInEditor: false
[hiddenAction_converTo_A]
autoTrigger: false
[hiddenAction_converTo_B]
autoTrigger: if not self.hasParent(withTag='Helicopter')
convertTo: Isniper
[hiddenAction_debuff]
text: assault mech debuff
description: normally unreadable...
autoTrigger: if numberOfUnitsInTeam(withTag="cyborg", withinRange=250, lessThan=1)
convertTo: IsniperHelicopter
spawnEffects: CUSTOM:powerFlashReverse, CUSTOM:powerFlashReverse2

[graphics]
image:        isniperGun.png
total_frames: 1
animation_attack_start: 0
animation_attack_end: 0
[attack]
isFixedFiring: false
maxAttackRange: 320
shootDelay: 190
[turret_1]
canShoot: true
limitingAngle: 105
[turret_2]
x: 3
y: 8
attachedTo: 1
slave: true
shoot_sound:cannon_firing
shoot_sound_vol:0.2
recoilOffset: -4


[projectile_1]
directDamage: 105
life: 50
instant: false
trailEffect: true
buildingDamageMultiplier: 0.1
speed: 30
trailEffectRate: 0.2
deflectionPower: -1

[attachment_buff]
x:0
y:0

onCreateSpawnUnitOf: powerUp

canBeAttackedAndDamaged: false
keepAliveWhenParentDies: false

setDrawLayerOnBottom: true
rotateWithParent: false
canAttack: false

[effect_lightSlowFade]
image: SHARED:light_50.png
life: 20
fadeOut: true
attachedToUnit: true
#color: #63e6e8
color: #FFEECCCC
scaleFrom: 0.2
scaleTo: 0.5
alpha: 0.5
drawUnderUnits:true

[effect_powerFlashReverse]
priority:low

frameIndex: 0
stripIndex: shockwave

life: 55
fadeOut: true
attachedToUnit: true
color: #FFFFFF
teamColorRatio: 0.8

dirSpeed: 2

fadeInTime: 7
scaleFrom: 1
scaleTo: 0.1
alpha: 0.9
drawUnderUnits:true
liveAfterAttachedDies: true

[effect_powerFlashReverse2]
priority:low

image: SHARED:light_50.png

life: 55
fadeOut: true
attachedToUnit: true
color: #FFFFFF
teamColorRatio: 0.8

dirSpeed: 2

fadeInTime: 0
scaleFrom: 0.5
scaleTo: 1
alpha: 1.6
drawUnderUnits:true
liveAfterAttachedDies: true