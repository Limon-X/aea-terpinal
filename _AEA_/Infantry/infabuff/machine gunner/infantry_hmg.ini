
[core]
showInEditor: false
name: machineGunnerBuff
displayText: Machine-gooner
displayDescription: -Moderately armored infantry\n-Machine gun with deployable bipod\n-Damage taken and speed is reduced when prone\n- Can attack ground & air
displayText_ru: Машина-пушечник
displayDescription_ru: - Пукает куда чаще своего собрата с винтовкой \n- Помимо всего прочего атакует кислых \n- Умеет раскладываться на травке и камушках для некоторого баффа
displayText_zh:机枪手
displayDescription_zh: -中等装甲型步兵\n-携带武器为机枪，可以进行卧倒\n-卧倒时受到的伤害降低并降低移动速度\n-可以攻击地面和空中单位

class: CustomUnitMetadata
price: 325
maxHp: 400
armour: 1
mass: 3000

techLevel: 2
buildSpeed: 5s
#availableInDemo: true

radius: 7
displayRadius: 9

isBio: true
softCollisionOnAll: 9

isUnrepairableUnit: true
selfRegenRate:0.3
#transportSlotsNeeded: 0.5
tags: infantry

action_1_convertTo: hmgDeployed
action_1_displayType: upgrade
action_1_price:  0
action_1_text: Deploy HMG
action_1_description: - Longer range, moves slower\n- More HP\n- Cant hit air while deployed
action_1_text_ru: Прилечь задохнуть
action_1_description_ru: - Пукает дальшее, двигается медленее \n- Становится чутка по-жирнее \n- Больше не целит кисленьких
action_1_text_zh: 部署HMG
action_1_description_zh:-射程增加，移动速度变慢\n-抗击打能力提升\n-卧倒状态无法击中空中单位
action_1_buildSpeed: 0.015
action_1_whenBuilding_cannotMove: true

[hiddenAction_debuff]
text: assault mech debuff
description: normally unreadable...
autoTrigger: if numberOfUnitsInTeam(withTag="cyborg", withinRange=250, lessThan=1)
convertTo: machineGunner
spawnEffects: CUSTOM:powerFlashReverse, CUSTOM:powerFlashReverse2
[graphics]
total_frames: 8

image:        hmg_body.png
