
[core]
name: IsniperHelicopter
copyFrom: isniper.ini
showInEditor: false
[hiddenAction_converTo_A]
autoTrigger: false
[hiddenAction_converTo_B]
autoTrigger: if not self.hasParent(withTag='Helicopter')
convertTo: Isniper
[hiddenAction_buff]
text: assault mech buff
description: normally unreadable...
autoTrigger: if numberOfUnitsInTeam(withTag="cyborg", withinRange=250, greaterThan=0)
convertTo: IsniperHelicopterBuff
spawnEffects: CUSTOM:powerFlash

[graphics]
image:        isniperGun.png
total_frames: 1
animation_attack_start: 0
animation_attack_end: 0
[attack]
isFixedFiring: false

maxAttackRange: 320
shootDelay: 190
[turret_1]
limitingAngle: 105
[turret_2]
x: 3
y: 8
attachedTo: 1
slave: true
shoot_sound:cannon_firing
shoot_sound_vol:0.2
recoilOffset: -4


[projectile_1]
directDamage: 105
life: 50
instant: false
trailEffect: true
buildingDamageMultiplier: 0.1
speed: 30
trailEffectRate: 0.2
deflectionPower: -1

[effect_powerFlash]
priority:low

frameIndex: 0
stripIndex: shockwave

life: 35
fadeOut: true
attachedToUnit: true
color: #FFFFFF
teamColorRatio: 0.8

hSpeed: 0.1
dirSpeed: 2

fadeInTime: 3
scaleFrom: 0.6
scaleTo: 1
alpha: 1
drawUnderUnits:true
liveAfterAttachedDies: true

[attachment_buff]
x:0
y:0

onCreateSpawnUnitOf: powerUp

canBeAttackedAndDamaged: false
keepAliveWhenParentDies: false

setDrawLayerOnBottom: true
rotateWithParent: false
canAttack: false