
[core]
name: c_experimentalSpider
copyFrom:ROOT:statusEffect.template

displayText: Experimental Spider AEA
displayDescription: - Support unit\n- Laser defense\n- Built in fabricator, generates Uranium\n- Can build/repair units and buildings\n- Has experimental armour-plating that reduces damage taken\n- Cannot fit in transports\n- Can build powerful experimentals\n- Can only have 5 built at once\n- Goes nuclear on death 
displayText_ru: Восьмипалый Семихуй 
displayDescription_ru: Батя всея АУЕ \n- Является основой вражеской Швиндоус и Беларуса \n- Строит, чинит, защищает \n- В общем, работу выполняет \n- Умеет запрашивать помощь с небес для повышения накала на поле боя \n- Только 5 на рыло игрока \n- Имеет возможность улучшения для особенно богатых
displayText_zh: AEA-概念型蜘蛛
displayDescription_zh:-支援类作战部队\n-携带激光防御装置\n-内置资源制造仪，能够生产铀\n-可以建造和修复部队和建筑物\n-携带概念型装甲，可以减少受到的伤害\n-几乎不可能被运输\n-可以建造强大的概念型单位\n-最大同时存在数量: 5\n-被摧毁后产生核爆

