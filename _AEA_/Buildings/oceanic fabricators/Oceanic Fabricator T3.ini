
[core]
@global cons: 4
name: Oceanic Fabricator T3

displayText: Oceanic Fabricator
displayDescription: 2x Credit Generation\n Max Tier
displayText_ru: Красная фабрика
displayDescription_ru: - "КПД 146.6%!" \n- Лучше некуда \n- Поговаривают, что сам Полулях учился у этого гения \n- Курс размена 4/20 \n- При недостатке ресурсов срабатывает система отключения
displayText_zh: 资源制造仪 T3
displayDescription_zh:-生成资金比T1提取器慢4倍\n-可升级到T3 \n-升级可增加资金生成\n-最大同时存在数量：40


class: CustomUnitMetadata
price: 9200
maxHp: 2200
mass: 9000
radius: 25
#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1
isBuilding: true
#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,1

#availableInDemo: true

generation_delay: 40
generation_credits: 20
generation_resources: uranium=-${cons}

techLevel: 2
buildSpeed: 0.0003



exit_x:0
exit_y:-1

tags: fabricator

[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons}
convertTo: Oceanic Fabricator T3

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo: T3OcFabOff

[graphics]

total_frames: 3

image:        seapower_t3.png
image_back:   seapower_t3.png
image_wreak:  seapower_dead.png

#scaleImagesTo: 20
#scaleTurretImagesTo: 9

#AUTO
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1


[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0


[movement]
movementType: WATER
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1

[ai]
upgradedFrom: Oceanic Fabricator
