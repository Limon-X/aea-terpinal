
[core]
@global cons: 5

name: Oceanic Fabricator T2

displayText: Oceanic Fabricator T2
displayDescription: +3.5x Credit Generation\n Upgradable!

displayText_ru: Жёлтая фабрика
displayDescription_ru: - Увеличивает свою КэПэДу на нанометр битригональный \n- Курс размена 5/12 \n- Урон пердежа ещё выше \n- При недостатке ресурсов срабатывает система отключения
displayText_zh: 资源制造仪 T2
displayDescription_zh:-生成资金比T1提取器慢4倍\n-可升级到T3 \n-升级可增加资金生成\n-最大同时存在数量：40

showInEditor: false

class: CustomUnitMetadata
price: 4500
maxHp: 1000
mass: 9000

#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1

#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,1

radius: 25
#displayRadius: 25
isBio: false
isBuilding: true

generation_delay: 40
generation_credits: 12
generation_resources: uranium=-${cons}
techLevel: 2
buildSpeed: 0.0004
exit_x:0
exit_y:-1

action_1_convertTo: Oceanic Fabricator T3
action_1_price:  5000
action_1_text: i:gui.actions.upgradeT3
action_1_description: Increased credit generation x2
action_1_description_ru: - Улучшает генерацию
action_1_description_zh: 资金生成效率翻倍
action_1_displayType: upgrade
action_1_buildSpeed: 60s
action_1_pos: 0.2

tags: fabricator

[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons}
convertTo: Oceanic Fabricator T2

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo: T2OcFabOff

[graphics]
@copyFrom_skipThisSection:true
total_frames: 3

image:        seapower_t2.png
image_back:   seapower_t2.png
image_wreak:  seapower_dead.png

#scaleImagesTo: 20
#scaleTurretImagesTo: 9

#AUTO
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1


[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0


[movement]
movementType: WATER
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1

[ai]
upgradedFrom: Oceanic Fabricator
