
[core]
@global cons: 6

name: Oceanic Fabricator

class: CustomUnitMetadata
price: 1200
maxHp: 500
mass: 9000

displayText: Fabricator
displayDescription: - Generates credits 4 times slower than T1 extractors\n- Upgradeable up to T3\n- Upgrades increase credit generation\n- Can only have 40 built at a time. 
displayText_ru: Зелёная фабрика
displayDescription_ru: - Даёт ну очень скромную прибыль за ваше Терпение \n- Осуществляет микро-пердёж при смерти \n- Курс размена: 6/4 \n- При недостатке ресурсов срабатывает система отключения
displayText_zh: 资源制造仪
displayDescription_zh:-生成资金比T1提取器慢4倍\n-可升级到T3 \n-升级可增加资金生成\n-最大同时存在数量：40

generation_delay: 40
generation_credits: 4
generation_resources: uranium=-${cons}


#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1


#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,1


techLevel: 1
buildSpeed: 0.0005


radius: 25
isBio: false

isBuilding: true


builtFrom_3_name: buildership
builtFrom_3_pos:  6.5

builtFrom_4_name: MAE-1
builtFrom_4_pos:  6.5

exit_x:0
exit_y:-1

action_1_convertTo: Oceanic Fabricator T2
action_1_price:  3000
action_1_text: i:gui.actions.upgradeT2
action_1_displayType: upgrade
action_1_buildSpeed: 38.6s
action_1_pos: 0.2
tags: fabricator

[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons}
convertTo: Oceanic Fabricator

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo: T1OcFabOff

[graphics]
@copyFrom_skipThisSection:true
total_frames: 3

image:        seapower_t1.png
image_back:   seapower_t1.png
image_wreak:  seapower_dead.png

#scaleImagesTo: 20
#scaleTurretImagesTo: 9

#AUTO
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1


[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0


[movement]
movementType: WATER
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1




[ai]

buildPriority: 0.03

noneInBaseExtraPriority: 0.04

noneGlobalExtraPriority: 0.1


maxEachBase: 1





