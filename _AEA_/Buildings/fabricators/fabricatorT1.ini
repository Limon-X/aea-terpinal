
[core]
@global cons: 6


name: c_fabricatorT1
class: CustomUnitMetadata
price: 1200
maxHp: 500
mass: 9000

displayText: Fabricator
displayDescription: - Generates credits 4 times slower than T1 extractors\n- Upgradeable up to T3\n- Upgrades increase credit generation\n- Can only have 40 built at a time. 
displayText_ru: Зелёная фабрика
displayDescription_ru: - Даёт ну очень скромную прибыль за ваше Терпение \n- Осуществляет микро-пердёж при смерти \n- Курс размена: 6/4 \n- При недостатке ресурсов срабатывает система отключения
displayText_zh: 资源制造仪
displayDescription_zh:-生成资金比T1提取器慢4倍\n-可升级到T3 \n-升级可增加资金生成\n-最大同时存在数量：40

overrideAndReplace: fabricator
generation_delay: 40
generation_credits: 4
generation_resources: uranium=-${cons}


#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1


#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,1


techLevel: 1
buildSpeed: 0.0006


radius: 20
isBio: false

isBuilding: true

fireTurretXAtSelfOnDeath: explode


tags: fabricator

[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons}
convertTo: c_fabricatorT1

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo: T1FabOff

[action_upgradeT2]

convertTo: fabricatorT2

price:  3000

text: i:gui.actions.upgradeT2

description: i:units.fabricator.upgrade.description


#text: i:units.fabricator.upgrade.name
displayType: upgrade
buildSpeed: 38.6s

iconImage: SHARED:icon_upgrade.png

[animation_idle]
@copyFrom_skipThisSection:true
onActions : idle
body_0s: {frame:2}
body_0.4s: {frame:2}
body_0.6s: {frame:0}
body_0.8s: {frame:0}
body_1.3s: {frame:2}



[graphics]

total_frames: 3


image: fabricatorT1.png

image_wreak: fabricator_dead.png



[attack]

canAttack: false

canAttackFlyingUnits: false

canAttackLandUnits: false

canAttackUnderwaterUnits: false


maxAttackRange: 0



[movement]

movementType: NONE

moveSpeed: 0

moveAccelerationSpeed: 0.01

moveDecelerationSpeed: 0.01


maxTurnSpeed: 0

turnAcceleration: 0.1




[turret_explode]

x:0

y:0

canShoot:false

projectile:explode




[projectile_explode]

life:99

instant: true


speed: 1

largeHitEffect: true


frame: 0

shadowFrame: 1

drawType: 1


targetGround: true

areaDamage: 350


areaRadius: 90

areaExpandTime: 35


deflectionPower: -1


lightColor: #FFEEEE00

lightSize: 1


friendlyFire: true





[ai]


buildPriority: 0.25
noneInBaseExtraPriority: 0.3
recommendedInEachBasePriorityIfUnmet: 0.1
noneGlobalExtraPriority: 0.1
ai_upgradePriority: 0.8

recommendedInEachBaseNum: 2
maxEachBase: 4
#maxGlobal: 40
