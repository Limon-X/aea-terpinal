[core]
@global cons: 4
name: c_fabricatorT3
copyFrom: fabricatorT1.ini
price: 9200
#1500t1+3000t2+5000t3=9500
maxHp: 2200

displayText: Fabricator T3
displayDescription: - Generates credits almost as fast as T1 extractors\n- Upgradeable up to T3\n- Upgrades increase credit generation\n- Can only have 40 built at a time. 
displayText_ru: Красная фабрика
displayDescription_ru: - "КПД 146.6%!" \n- Лучше некуда \n- Поговаривают, что сам Полулях учился у этого гения \n- Курс размена 4/20 \n- При недостатке ресурсов срабатывает система отключения
displayText_zh: 资源制造仪 T3
displayDescription_zh:-生成资金比T1提取器慢4倍\n-可升级到T3 \n-升级可增加资金生成\n-最大同时存在数量：40

overrideAndReplace: fabricatorT3
generation_delay: 40
generation_credits: 20
generation_resources: uranium=-${cons}

techLevel: 2
buildSpeed: 0.0003

[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons}
convertTo: c_fabricatorT3

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo: T3FabOff


[action_upgradeT2]
@copyFrom_skipThisSection:true

