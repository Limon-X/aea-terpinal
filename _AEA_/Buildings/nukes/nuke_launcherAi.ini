[core]
name: nukeLauncherAEAAi
class: CustomUnitMetadata
copyFrom: nuke_launcher.ini
displayText: Nuke
displayDescription: AI puker
displayText_ru: Ядерная яма
displayDescription_ru: Выдает стиляги на врагов в неограниченном радиусе, парализуя их возможности по игре
tags: aida
[hiddenAction_NukerAI]
autoTrigger: if self.isControlledByAI() and self.hasResources(credits=30000) and self.ammoIncludingQueued(lessThan=4)
alsoQueueAction: buildNuke

[comment_hiddenAction_vangaskill]
autoTrigger: if self.isControlledByAI() and self.customTimer(laterThanSeconds=20)
resetCustomTimer:true
showMessageToAllPlayers: Vangaskill is active
fireTurretXAtGround: predict

[hiddenAction_fire]
autoTriggerOnEvent: tookDamage(withTag='nukemeplsAEA')
requireConditional: if self.ammo>0 and self.isControlledByAI() and self.queueSize() <1
showMessageToAllPlayers: Launch detected
price: ammo=1
fireTurretXAtGround: siloTop
fireTurretXAtGround_withTarget: eventSource
whenBuilding_playAnimation: fireNuke
displayRemainingStockpile: true
highPriorityQueue: true
onlyOneUnitAtATime: true

playSoundGlobally: ROOT:data\soundFx\nukeLaunch.ogg:2

[attack]
canAttack: true
turretMultiTargeting: true

[turret_predict]
canShoot: true
canAttackLandUnits: true
x:0
y:0
invisible: true
projectile: 1
canOnlyAttackUnitsWithTags: exp, fabricator
delay: 60s
clearTurretTargetAfterFiring: true
limitingMinRange: 600

[projectile_1]
life: 180
instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
invisible: true
directDamage: 0
spawnUnit: markAEA

[ai]
upgradedFrom: nukeLauncherAEA
