[core]
@global cons: 7
#copyFrom: ROOT:data\unitsystem\_Ai_forceRepair_Parent.template
copyFrom: ROOT:data\unitsystem\_shieldguard.template
name: drillT1
class: CustomUnitMetadata
price: 1500
maxHp: 500
mass: 9000

displayText: Drill
displayDescription: - Generates credits 4 time slower than extractor\n- Upgradable 
displayText_ru: Дрель-шуруповёрт Milwaukee
displayDescription_ru: - Разменивает Терпение на валюту \n- Прокачивается \n- Текущий курс 7/5 \n- При недостатке Терпение дрель автоматически затормаживается
displayText_zh: 钻井 Tech-I
displayDescription_zh: -生成资金比提取器慢4倍\n-可进行技术升级

#displayLocaleKey: fabricator
#displayLocaleKey: fabricator
#overrideAndReplace: fabricator

#price per credit: $1100
generation_delay: 40
generation_credits: 5
generation_resources: uranium=-${cons}

footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1

#footprint: -1,0,0,1
#constructionFootprint: -1,0,0,1
#buildingToFootprintOffsetX: 0
#buildingToFootprintOffsetY: 20

techLevel: 1
buildSpeed: 0.0006

radius: 20

isBio: false
isBuilding: true
#overrideAndReplace: fabricator
fireTurretXAtSelfOnDeath: explode

tags: fabricator

[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons} and not self.tags(includes='decoy')
convertTo: drillT1
[hiddenAction_GetUpDecoy]
autoTrigger: if self.resource(type="uranium") >= 4*${cons} and self.tags(includes='decoy')
convertTo: decoy_drillT1

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo_keepCurrentTags: true
convertTo: drillT1Off

[action_upgradeT2]
isVisible: if not self.tags(includes='decoy') and self.tags(includes='fabricator')
convertTo: drillT2
price:  3000
text: Upgrade
text_ru: Закупка шуриков Thakitta
description_ru: - Курс размена будет 6/15
text_zh:技术升级
#description: i:units.fabricator.upgrade.description
#text: i:units.fabricator.upgrade.name

displayType: upgrade
buildSpeed: 38.6s

#iconImage: SHARED:icon_upgrade.png
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF

[graphics]
total_frames: 4

image:        drillT1.png
image_wreak:  NONE
animation_idle_start: 1
animation_idle_end: 3
animation_idle_speed: 9

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1

[turret_explode]
x:0
y:0
canShoot:false
projectile:explode

[projectile_explode]
life:99
instant: true

speed: 1
largeHitEffect: true
frame: 0
shadowFrame:1
drawType:1

targetGround: true
areaDamage: 350
areaRadius: 90
areaExpandTime:35

deflectionPower:-1

lightColor: #FFEEEE00
