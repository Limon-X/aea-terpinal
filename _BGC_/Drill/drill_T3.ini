
[core]
@global cons: 5
showInEditor: true


name: drillT3

displayText: Drill T-III
displayText_ru: Дрель-шуруповёрт DeWalt 
copyFrom: drill_T1.ini
price: 9500
maxHp: 2200

displayDescription: - Generates credits 4 time slower than extractor\n-MAX
displayDescription_ru: - Пик касества и эффектности \n- 5/25 \n- \n- При недостатке Терпение, дрель автоматически затормаживается
displayText_zh: 钻井 Tech-III
displayDescription_zh: - 生成资源效率比提取器慢4倍\n-MAX
#overrideAndReplace: fabricatorT3
generation_delay: 40
generation_credits: 25
generation_resources: uranium=-${cons}
techLevel: 2
buildSpeed: 0.0003

[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons} and not self.tags(includes='decoy')
convertTo: drillT3
[hiddenAction_GetUpDecoy]
autoTrigger: if self.resource(type="uranium") >= 4*${cons} and self.tags(includes='decoy')
convertTo: decoy_drillT3

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo_keepCurrentTags: true
convertTo: drillT3Off

[action_upgradeT2]
@copyFrom_skipThisSection:true


[projectile_explode]
areaDamage: 850

[graphics]
image:        drillT3.png
animation_idle_speed: 3
[ai]
upgradedFrom: drillT1



