[core]
showInEditor: true
name: markAEA
displayText: markAEA
displayDescription: nuke marker
mass: 1
price: 0
maxHp: 1
tags: kickme
radius: 10
showOnMinimapToEnemies: false
isUnselectable: false
canNotBeDirectlyAttacked: true
canNotBeDamaged: true
#canNotBeGivenOrdersByPlayer: true
isUnselectableAsTarget: true
fogOfWarSightRange: 0


[action_WhoIsMyDaddy]
displayType: upgrade
isVisible: true
isActive: true
text: my daddy uwu: %{self.parent()}
description: %{self.customTarget1.x} %{self.customTarget1.y}
unitShownInUI: unitref self.customTarget1
resetCustomTimer: true

[hiddenAction_nukeme]
autoTrigger: if self.numberOfUnitsInEnemyTeam(withinRange=400, withTag='fabricator', greaterThan=0) or self.numberOfUnitsInEnemyTeam(withinRange=400, withTag='exp', greaterThan=4)
sendMessageTo: self.customTarget1
sendMessageWithTags: NukeHere
alsoQueueAction: goback

[hiddenAction_goback]
buildSpeed: 5s
teleportTo: self.customTarget1

[graphics]
image: null.png
image_wreak: none

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 99999
shootDelay: 1s
turretMultiTargeting: true

[turret_2]

x:0
y:0
projectile: 2
invisible: true
canOnlyAttackUnitsWithTags: fabricator, exp
clearTurretTargetAfterFiring: true

[projectile_2]
life: 120
directDamage: 0
tags: nukemeplsAEA
instant: true
friendlyFire: true
deflectionPower: -1
invisible: true
teleportSource: true

[movement]
movementType: NONE
moveSpeed: 0