[core]
showInEditor: false
name: mark
displayText: mark
displayDescription: nuke marker
mass: 1
price: 0
maxHp: 1
tags: kickme
radius: 10
showOnMinimapToEnemies: false
isUnselectable: true
canNotBeDirectlyAttacked: true
canNotBeDamaged: true
canNotBeGivenOrdersByPlayer: false
isUnselectableAsTarget: true
fogOfWarSightRange: 0

[hiddenAction_dedupe]
autoTrigger: if self.numberOfUnitsInTeam(withinRange=200, withTag='kickme', greaterThan=1) or self.timeAlive()>15
deleteSelf: true

[hiddenAction_nukemeBGC]
autoTrigger: if self.numberOfUnitsInEnemyTeam(withinRange=400, withTag='fabricator', greaterThan=3) or self.numberOfUnitsInEnemyTeam(withinRange=400, withTag='exp', greaterThan=10)

switchToAggressiveTeam: true
fireTurretXAtGround: 1

[graphics]
image: null.png
image_wreak: none

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 99999
shootDelay: 14s
turretMultiTargeting: true
[turret_1]

x:0
y:0
projectile: 1
invisible: true
canOnlyAttackUnitsWithTags: aidb
clearTurretTargetAfterFiring: true

[turret_2]
canAttackCondition: if self.globalTeamTags(includes='IAMAEA') and self.isControlledByAI()
x:0
y:0
projectile: 2
invisible: true
canOnlyAttackUnitsWithTags: aida
clearTurretTargetAfterFiring: true

[turret_3]
canAttackCondition: if self.globalTeamTags(includes='IAMEKE') and self.isControlledByAI()
x:0
y:0
projectile: 3
invisible: true
canOnlyAttackUnitsWithTags: aidc
clearTurretTargetAfterFiring: true

[projectile_1]
life: 120
directDamage: 0
tags: nukemeplsBGC
instant: true
friendlyFire: true
deflectionPower: -1
invisible: true

[projectile_2]
life: 120
directDamage: 1
tags: nukemeplsAEA
instant: true
friendlyFire: true
deflectionPower: -1
invisible: true

[projectile_3]
life: 120
directDamage: 1
tags: nukemeplsEKE
instant: true
friendlyFire: true
deflectionPower: -1
invisible: true


[movement]
movementType: NONE
moveSpeed: 0