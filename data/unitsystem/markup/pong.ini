[core]
dont_load: true
showInEditor: true
name: recept
displayText: eater
displayDescription: eats msg shit
mass: 1
price: 0
maxHp: 1
tags: kickya, sendNudes
radius: 10
showOnMinimapToEnemies: false
isUnselectable: false
canNotBeDirectlyAttacked: false
canNotBeDamaged: false
canNotBeGivenOrdersByPlayer: true
isUnselectableAsTarget: false

[action_Pong]
autoTriggerOnEvent: tookDamage(withTag='nukemepls')
showMessageToAllPlayers: "PONG!"
setCustomTarget2: eventSource
#looking if customTarget works properly with window
isVisible: true
pos: 0
displayType: infoOnlyNoBox
text: %{customTarget2.playerName()}
description: TRGT: %{customTarget2.x()}, %{customTarget2.y()} 
unitShownInUI: unitref customTarget2
[action_WhoIs]
autoTriggerOnEvent: tookDamage(withTag='nukemepls')
showMessageToAllPlayers: "TARGET CONFIRMED!"
setCustomTarget2: eventSource
#looking if customTarget works properly with window
isVisible: true
pos: -1
displayType: infoOnlyNoBox
text: %{customTarget2.playerName()}
description: TRGT: %{customTarget2.x()}, %{customTarget2.y()} 
unitShownInUI: unitref customTarget2

[hiddenAction_dedupe]
autoTrigger: if self.numberOfUnitsInTeam(withinRange=200, withTag='kickme', greaterThan=1) or self.timeAlive()>15
deleteSelf: true

[comment_hiddenAction_teleTo]
autoTrigger: if self.hasParent()
teleportTo: unitref nearestUnit(withTag='kickme')

[graphics]
image: null.png
image_wreak: none

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[movement]
movementType: NONE
moveSpeed: 0