
[core]
name: module_RepairBot_T2
displayText: Repair Bot T2
displayDescription: [Support Module]\n-Repair Bot\n-Increase unit self repair rate\n-Can repair nearby allied unit and structure\n-Can be toggle self repair only\n-Can build structures
displayText_ru: Ремонтный раб II
displayDescription_ru: Усилен захил и радиус этого ссамого захила \n- Есть два режима: себяшний и всякоподрячный \n- Первый хилит себя \n- Второй и себя, и других
displayText_zh: 修复站 T2
displayDescription_zh: [支援模块]\n-修复机器人\n-提高部队自我修复效率\n-可以修复附近的盟军部队和建筑\n-只能切换自修复\n-可以构建建筑

price: 6000
copyFrom:module_repairBot.ini, ROOT:data\effects\repair_effect.template


nanoBuildSpeed: 1
nanoRange:  200
#-----------test
nanoRepairSpeed: 0.7

[action_selfRepair]
isActive: true
text: Heal Me!
text_ru: Всякоподрячный
text_zh: 保护我!
isGuiBlinking: true
#description: Toggle to extends nano range\n-Able to repair allied units and structure\nNano range: 150
description: - Prioritize repairing the parent Unit
description_ru: - Лечит не только себя, но и окружение
description_zh: -优先修复父级单位
buildSpeed: 0.2s
whenBuilding_temporarilyConvertTo: module_RepairBot_T2_selfR
convertTo: module_RepairBot_T2
iconImage: rep_eye.png
[action_Toggle]
isActive: true
isGuiBlinking: false
text: Self Repair Only
description: Only repair the parent Unit\n-Descrease nano range
text_ru: Себяшний
description_ru: В приоритете только носитель
text_zh: 仅自我修复
description_zh:-仅修复父单位\n-减少纳米范围

