
[core]

copyFrom: kineticstrike.ini

showInEditor: true
isLockedIfGameModeNoNuke:true

name: EkKineticSpawner
class: CustomUnitMetadata

tags: H-end, KineticStrike

[hiddenAction_disrupted]
autoTriggerOnEvent: newMessage(withTag="disruption_kineticstrike")
deleteSelf: true
showMessageToAllEnemyPlayers: %{self.playerName}s laser has been successfully disrupted!
showMessageToAllEnemyPlayers_ru: Плюха %{self.playerName} была успешно отражена!
playSoundGlobally: ROOT:data/soundFx/_quick_poop.ogg:5

[action_triggerSpawn]
autoTrigger: if self.energy(greaterThan=0)
isVisible: false
convertTo: EkKineticStrike
playSoundAtUnit: kinetic_tail.ogg

[graphics]
total_frames: 1

image:        icon_kinetic.png
image_wreak:  NONE
image_turret: NONE

#scaleImagesTo: 20
#scaleTurretImagesTo: 9

image_shadow: NONE