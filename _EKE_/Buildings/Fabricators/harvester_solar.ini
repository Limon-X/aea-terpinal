
[core]
@global cons: 6
name: EkHarvesterSolar

displayText: Solar Farm
displayDescription: -A small solar panel array\n-Produces 2 income

displayText_ru: Китай ферма
displayDescription_ru: - Маленькая станция для обеспечения майнинга \n- Позволяет конвертировать Терпение в валюту \n- Текущий курс невыговный: 6/4 \n- В случае недостатка ресурсов, обмен прекращается
displayText_zh: 太阳能发电场
displayDescription_zh: - 一个小型太阳能电池板阵列\n-每秒提供2的资金收入

class: CustomUnitMetadata
price: 1200
maxHp: 500
mass: 9000
generation_delay: 40
generation_credits: 4
generation_resources: uranium=-${cons}

#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1
#used for placement, and placement of other buildings
constructionFootprint:-1,-1,1,1

#buildingToFootprintOffsetX:20
buildingToFootprintOffsetY:10

techLevel: 1
buildSpeed: 0.0005
#availableInDemo: true

radius: 25
displayRadius: 25
buildingSelectionOffset: -4

isBuilding: true
isBio: false

action_1_convertTo: EkHarvesterTanks
action_1_price:  3000
action_1_text: [Upgrade T2] 
action_1_text_ru: Улучшить до Т2
action_1_text_zh: [升级 T2] 
#action_1_description: 
action_1_displayType: upgrade
action_1_buildSpeed: 38.6s
action_1_pos: 1.1

#---------------------added
[hiddenAction_noJacas]
requireConditional:  if not self.globalTeamTags(includes='EKE_noHack')
autoTriggerOnEvent: created
addResources: 1500
deleteSelf: true
showMessageToPlayer: Unauthorized!
showMessageToPlayer_ru: Китай Партия не одобряет такой деятельности!
showMessageToPlayer_zh: 未授权!
#---------------------
[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons}
convertTo: EkHarvesterSolar

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo: EkHarvesterSolarOff

[graphics]
total_frames: 1

image:        harvester_solar.png
image_wreak:  NONE
image_turret: NONE

#scaleImagesTo: 20
#scaleTurretImagesTo: 9

#AUTO
image_shadow: AUTO
shadowOffsetX:1.5
shadowOffsetY:1.5

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

maxAttackRange: 0

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1

[ai]


buildPriority: 0.32
noneInBaseExtraPriority: 0.3
recommendedInEachBasePriorityIfUnmet: 0.4
noneGlobalExtraPriority: 0.4
ai_upgradePriority: 0.9

recommendedInEachBaseNum: 4
maxEachBase: 5
#maxGlobal: 40