[core]
@global cons: 5
name: EkHarvesterTanks

displayText: Oil Tanks
displayDescription: -Stores oil for various machines\n-Produces 7 income

displayText_ru: Бочки с маслом
displayDescription_ru: - Большие бочки для хранения\n- Конвертирует Терпение в валюту с курсом 5/12 \n- В случае недостатка ресурсов, обмен прекращается \n "Ходят слухи, что это секретный актив некого Вани Гея..." 
displayText_zh:油罐
displayDescription_zh:-为各种机器存储机油\n-每秒产生7的资金收入

class: CustomUnitMetadata
price: 4200
maxHp: 1000
mass: 9000
generation_delay: 40
generation_credits: 12
generation_resources: uranium=-${cons}

#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1
#used for placement, and placement of other buildings
constructionFootprint:-1,-1,1,1

#buildingToFootprintOffsetX:20
buildingToFootprintOffsetY:10

