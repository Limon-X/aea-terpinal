action_1_price:  5000
action_1_text: [Upgrade T3] 
action_1_text_ru: Улучшить до Т3
action_1_text_zh: [升级 T3] 
#action_1_description: 
action_1_displayType: upgrade
action_1_buildSpeed: 60s
action_1_pos: 1.1

[action_cap]
isActive: false
displayType: infoOnly
price: maxfabs=1
addResources: maxfabs=1
displayRemainingStockpile: true


[hiddenAction_GetUp]
autoTrigger: if self.resource(type="uranium") >= 4*${cons}
convertTo: EkHarvesterTanks

[hiddenAction_GetDown]
autoTrigger: if self.resource(type="uranium") < 4*${cons}
convertTo: EkHarvesterTanksOff
